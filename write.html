<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 · ssalmuck</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><div><a class="brand" href="index.html">ssalmuck</a> <span class="version">beta 1.7.0</span></div><nav><a href="index.html">이벤트</a><a href="about.html">소개</a><a data-write-link href="write.html">글쓰기</a><a href="mypage.html" data-auth-link>로그인</a><a href="admin.html" data-admin-link hidden>관리자</a></nav></div></header><main class="container admin-layout"><section><h1 class="page-title">이벤트 등록</h1><p id="userStatus" class="muted"></p><div id="message" class="notice" hidden></div></section><section id="loginRequired" class="admin-card" hidden><h2>로그인이 필요합니다</h2><a class="btn primary" href="auth.html">로그인</a></section><section id="editorSection" class="admin-card" hidden><form id="eventForm" class="event-form"><input id="eventId" type="hidden"><label>제목<span class="req">*</span><input id="title" required maxlength="100"></label><div class="form-row single"><label>카테고리<span class="req">*</span><select id="category" required><option>금융</option><option>앱테크</option><option>경품</option><option>게임</option><option>기타</option></select></label></div><section class="form-section"><div class="form-section-title"><strong>보상</strong></div><div class="form-row single"><label>종류(필터용)<select id="rewardType"><option>현금</option><option>기프티콘</option><option>포인트</option><option>상품</option><option>기타</option></select></label></div><label>썸네일 표시<span class="req">*</span><input id="reward" required maxlength="80" placeholder="예: 네이버페이 10,000원 · 추첨"></label><label>상세내역<textarea id="rewardDetails" rows="4" maxlength="2000" placeholder="예: 1등 5만원, 2등 1만원"></textarea></label><div class="form-row single"><label>지급 방식<select id="paymentMethod"><option>즉시 지급</option><option>조건 달성 후 지급</option><option>추첨 후 제공</option><option>선착순 지급</option><option>기타</option></select></label></div><div class="tag-editor"><span>보상 태그</span><div class="tag-presets" data-tag-group="reward"></div><div class="tag-custom-row"><input data-custom-tag="reward" placeholder="태그 직접 입력"><button class="btn secondary" type="button" data-add-tag="reward">추가</button></div><div class="selected-tags" id="rewardTags"></div></div></section><section class="form-section"><div class="form-section-title"><strong>참여 방법</strong></div><div class="form-row"><label>썸네일 시간(분)<input id="durationMinutes" type="number" min="0" step="1" placeholder="5"></label><label>썸네일 표시<input id="duration" maxlength="40" placeholder="예: 5분"></label></div><label>상세내역<textarea id="durationDetails" rows="4" maxlength="2000" placeholder="예: 앱 설치 후 회원가입, 이메일 인증 필요"></textarea></label><div class="tag-editor"><span>참여 방법 태그</span><div class="tag-presets" data-tag-group="effort"></div><div class="tag-custom-row"><input data-custom-tag="effort" placeholder="태그 직접 입력"><button class="btn secondary" type="button" data-add-tag="effort">추가</button></div><div class="selected-tags" id="effortTags"></div></div></section><section class="form-section"><div class="form-section-title"><strong>자격요건</strong></div><label>상세내역<textarea id="eligibility" rows="4" maxlength="2000" placeholder="예: 인천시민, 서울대생"></textarea></label><label>지역 요건(선택)<select id="eligibilityRegion"><option value="">선택하지 않음</option><option value="서울특별시">서울특별시</option><option value="부산광역시">부산광역시</option><option value="대구광역시">대구광역시</option><option value="인천광역시">인천광역시</option><option value="광주광역시">광주광역시</option><option value="대전광역시">대전광역시</option><option value="울산광역시">울산광역시</option><option value="세종특별자치시">세종특별자치시</option><option value="경기도">경기도</option><option value="강원특별자치도">강원특별자치도</option><option value="충청북도">충청북도</option><option value="충청남도">충청남도</option><option value="전북특별자치도">전북특별자치도</option><option value="전라남도">전라남도</option><option value="경상북도">경상북도</option><option value="경상남도">경상남도</option><option value="제주특별자치도">제주특별자치도</option></select><small class="field-help">특정 지역 거주자만 참여 가능한 경우 선택하세요.</small></label><div class="tag-editor"><span>요건 태그</span><div class="tag-presets" data-tag-group="eligibility"></div><div class="tag-custom-row"><input data-custom-tag="eligibility" placeholder="태그 직접 입력"><button class="btn secondary" type="button" data-add-tag="eligibility">추가</button></div><div class="selected-tags" id="eligibilityTags"></div></div></section><section class="form-section"><div class="form-row three"><label>마감일<span class="req">*</span><input id="deadline" type="date" required></label><label>당첨 발표일<input id="winnerAnnouncementDate" type="date"></label><label>참여 링크<input id="url" type="url" placeholder="https://..."></label></div><label>대표 이미지<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><img id="imagePreview" class="image-preview" alt="이미지 미리보기"><input id="existingImageUrl" type="hidden"><label>추가 홍보자료·상세설명<span class="req">*</span><textarea id="content" required rows="8" maxlength="5000"></textarea></label></section><div class="form-actions"><button class="btn primary">저장</button><button class="btn secondary" id="cancelEdit" type="button" hidden>취소</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="common.js"></script><script src="write.js"></script></body></html>
