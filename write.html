<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 · ssalmuck</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><div><a class="brand" href="index.html">ssalmuck</a> <span class="version">beta 1.3.0</span></div><nav><a href="index.html">이벤트</a><a data-write-link href="write.html">글쓰기</a><a href="mypage.html" data-auth-link>로그인</a><a href="admin.html" data-admin-link hidden>관리자</a></nav></div></header><main class="container admin-layout"><section><p class="eyebrow">CONTRIBUTE</p><h1 class="page-title">이벤트 글쓰기</h1><p id="userStatus" class="muted">로그인 상태를 확인하고 있습니다.</p><div id="message" class="notice" hidden></div></section><section id="loginRequired" class="admin-card" hidden><h2>로그인이 필요합니다</h2><a class="btn primary" href="auth.html">로그인</a></section><section id="editorSection" class="admin-card" hidden><h2 id="formTitle">새 이벤트 등록</h2><form id="eventForm" class="event-form"><input id="eventId" type="hidden"><label>제목<input id="title" required maxlength="100"></label><div class="form-row"><label>카테고리<select id="category" required><option>금융</option><option>앱테크</option><option>경품</option><option>게임</option><option>기타</option><option value="직접입력">직접 입력</option></select></label><label id="categoryCustomWrap" hidden>카테고리 직접 입력<input id="categoryCustom" maxlength="30" placeholder="예: 대학생 지원"></label></div><section class="form-section"><div class="form-section-title"><strong>보상 정보</strong><span>사용자가 가장 먼저 확인하는 정보입니다.</span></div><div class="form-row three"><label>보상 종류<select id="rewardType" required><option>현금</option><option>기프티콘</option><option>포인트</option><option>상품</option><option value="직접입력">직접 입력</option></select></label><label id="rewardCustomWrap" hidden>보상 종류 직접 입력<input id="rewardCustom" maxlength="30" placeholder="예: 영화관람권"></label><label>보상 금액/가치<input id="rewardAmount" type="number" min="0" step="1" placeholder="예: 10000"></label></div><label>보상 상세 설명<input id="reward" required maxlength="80" placeholder="예: 네이버페이 포인트 10,000원"></label><div class="form-row"><label>지급 방식<select id="paymentMethod" required><option>즉시 지급</option><option>조건 달성 후 지급</option><option>추첨 후 제공</option><option>선착순 지급</option><option value="직접입력">직접 입력</option></select></label><label id="paymentCustomWrap" hidden>지급 방식 직접 입력<input id="paymentMethodCustom" maxlength="40" placeholder="예: 익월 말 일괄 지급"></label></div></section><section class="form-section"><div class="form-section-title"><strong>참여 조건</strong><span>자격이 맞는지 바로 판단할 수 있게 적어주세요.</span></div><label>자격요건<textarea id="eligibility" required rows="3" maxlength="1000" placeholder="예: 만 19세 이상, 최근 6개월 이내 해당 서비스 이용 이력이 없는 신규 회원"></textarea></label><div class="form-row"><label>예상 소요시간(분)<input id="durationMinutes" type="number" min="0" step="1" placeholder="예: 5"></label><label>소요시간 상세<input id="duration" maxlength="40" placeholder="예: 본인인증 포함 약 5분"></label></div></section><div class="form-row"><label>마감일<input id="deadline" type="date" required></label><label>참여 링크<input id="url" type="url" placeholder="https://..."></label></div><div class="form-row"><label>당첨자 발표일 (선택)<input id="winnerAnnouncementDate" type="date"></label><label>당첨자 수 (선택)<input id="winnerCount" type="number" min="0" step="1" placeholder="예: 100"></label></div><label>대표 이미지 (선택, 5MB 이하)<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><img id="imagePreview" class="image-preview" alt="이미지 미리보기"><input id="existingImageUrl" type="hidden"><label>이벤트 설명<textarea id="content" required rows="9" maxlength="5000"></textarea></label><div class="form-actions"><button class="btn primary">저장</button><button class="btn secondary" id="cancelEdit" type="button" hidden>수정 취소</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-client.js"></script><script src="common.js"></script><script src="write.js"></script></body></html>
