<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>글쓰기 · ssalmuck</title>
  <link rel="stylesheet" href="styles.css?v=1.9.0">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <div><a class="brand" href="index.html">ssalmuck</a> <span class="version">beta 1.9.0</span></div>
    <nav><a href="index.html">이벤트</a><a href="about.html">소개</a><a data-write-link href="write.html">글쓰기</a><a href="mypage.html" data-auth-link>로그인</a><a href="admin.html" data-admin-link hidden>관리자</a></nav>
  </div>
</header>
<main class="container admin-layout compact-write-layout">
  <section>
    <h1 class="page-title">이벤트 등록</h1>
    <p id="userStatus" class="muted"></p>
    <p class="required-note"><span class="req">*</span> 필수 입력 항목</p>
    <div id="message" class="notice" hidden></div>
  </section>
  <section id="loginRequired" class="admin-card" hidden>
    <h2>로그인이 필요합니다</h2><a class="btn primary" href="auth.html">로그인</a>
  </section>
  <section id="editorSection" class="admin-card" hidden>
    <form id="eventForm" class="event-form simplified-event-form">
      <input id="eventId" type="hidden">
      <label><span class="field-label">제목 <span class="req">*</span></span><input id="title" required maxlength="100" placeholder="이벤트 제목"></label>
      <label><span class="field-label">보상 <span class="req">*</span></span><input id="reward" required maxlength="100" placeholder="예: 네이버페이 10,000원 · 추첨"></label>
      <label><span class="field-label">참여 방법 <span class="req">*</span></span><input id="participationMethod" required maxlength="100" placeholder="예: 유튜브 댓글 작성"></label>
      <label><span class="field-label">예상 소요시간 <span class="req">*</span></span><input id="duration" required maxlength="40" placeholder="예: 5분"></label>
      <label><span class="field-label">상세 내역 <span class="req">*</span></span><textarea id="content" required rows="10" maxlength="5000" placeholder="보상 조건, 참여 절차, 자격 요건 등 필요한 내용을 한 번에 적어주세요."></textarea></label>
      <div class="form-row">
        <label>마감일 <span class="field-help">모르면 비워두세요</span><input id="deadline" type="date"></label>
        <label>참여 링크<input id="url" type="url" placeholder="https://..."></label>
      </div>
      <label>대표 이미지<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label>
      <img id="imagePreview" class="image-preview" alt="이미지 미리보기">
      <input id="existingImageUrl" type="hidden">
      <div class="form-actions"><button class="btn primary">저장</button><button class="btn secondary" id="cancelEdit" type="button" hidden>취소</button></div>
    </form>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=1.9.0"></script><script src="supabase-client.js?v=1.9.0"></script><script src="common.js?v=1.9.0"></script><script src="write.js?v=1.9.0"></script>
</body>
</html>
