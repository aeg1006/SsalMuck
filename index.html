<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ssalmuck · 돈 되는 이벤트</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><div class="container header-inner"><div><a class="brand" href="index.html">ssalmuck</a> <span class="version">beta 1.3.0</span></div><nav><a href="index.html">이벤트</a><a data-write-link href="write.html">글쓰기</a><a href="mypage.html" data-auth-link>로그인</a><a href="admin.html" data-admin-link hidden>관리자</a></nav></div></header><main class="container"><section class="hero"><p class="eyebrow">SMART REWARD COMMUNITY</p><h1>오늘도 알뜰하게,<br><span class="hero-accent">쌀먹하자!</span></h1><p>10원도 놓치지 않는 사람들을 위한 돈 되는 이벤트 모음입니다.</p><div id="setupNotice" class="notice warning" hidden>Supabase 연결 설정이 필요합니다.</div></section><section id="noticeList" class="notice-list"></section><section class="filter-panel" aria-label="이벤트 검색과 정렬"><div class="filter-search"><label for="searchInput">이벤트 검색</label><input id="searchInput" class="input" placeholder="이벤트명, 자격요건, 보상을 검색하세요"></div><div class="filter-control"><label for="categoryFilter">카테고리</label><select id="categoryFilter"><option value="all">전체 카테고리</option><option>금융</option><option>앱테크</option><option>경품</option><option>게임</option><option>기타</option></select></div><div class="filter-control"><label for="sortFilter">정렬</label><select id="sortFilter"><option value="newest">최신 등록 순</option><option value="reward_desc">보상 높은 순</option><option value="duration_asc">소요시간 짧은 순</option><option value="rating_desc">밥점수 높은 순</option><option value="deadline_asc">마감 임박 순</option></select></div></section><section id="hotSection" class="hot-section" hidden><div class="section-heading hot-heading"><div><p class="eyebrow">HOT RICE</p><h2>🔥 따끈한 밥</h2></div><span class="count">사람들이 많이 찜하고 완료한 이벤트</span></div><div id="hotEventList" class="hot-event-grid"></div></section><div class="section-heading"><h2>진행 중인 이벤트</h2><span i
